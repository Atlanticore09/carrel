<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Carrel · deine Lernzeit zählt sich von selbst. Automatisch, in jeder Bibliothek.">
<meta name="theme-color" content="#0F1A2E">
<meta name="robots" content="noindex">
<title>Carrel · deine Lernzeit zählt sich von selbst</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner wrap">
      <a class="brand" href="#top"><img id="logo" class="pixel" src="assets/img/logo.png" alt=""><span id="appName">Carrel</span></a>
      <div class="badges"></div>
    </div>
  </nav>

  <main>
  <header class="hero" id="top">
    <div class="hero-bg"><img id="hero-bg-img" src="assets/img/philo-hero.png" alt=""></div>
    <div class="stars"></div>
    <img id="owl" class="owl pixel" src="assets/img/owl-anim.png" alt="">
    <div class="hero-inner">
      <h1 id="headline">&nbsp;</h1>
      <p class="sub" id="sub">&nbsp;</p>
      <div class="badges"></div>
      <p class="dlnote" id="dlnote"></p>
      <p class="everylib"><img class="pixel" src="assets/img/ic-geofence.png" alt=""><span id="everylib"></span></p>
    </div>
  </header>

  <section class="sec"><div class="wrap">
    <div class="benefits" id="benefits"></div>
  </div></section>

  <section class="sec" style="background:var(--navy2)"><div class="wrap">
    <p class="kicker">So funktioniert's</p>
    <h2 id="howHead"></h2>
    <p class="lead" id="howSub"></p>
    <div class="steps" id="howSteps"></div>
  </div></section>

  <section class="sec"><div class="wrap">
    <p class="kicker">Features</p>
    <h2 id="featHead"></h2>
    <p class="lead" id="featSub"></p>
    <div class="feature-grid" id="featGrid"></div>
    <div class="heatmap reveal-up">
      <div class="hm-t"><span>Deine Lern-Heatmap</span><span>dieses Semester</span></div>
      <div class="hm-grid" id="hmGrid"></div>
    </div>
  </div></section>

  <section class="sec" style="background:var(--navy2)"><div class="wrap">
    <p class="kicker">FAQ</p>
    <h2 id="faqHead"></h2>
    <div class="faq-list" id="faqList"></div>
  </div></section>

  <section class="sec cta"><div class="wrap">
    <p class="tag" id="ctaTag"></p>
    <h2 id="ctaHead"></h2>
    <div class="badges" style="margin-top:20px"></div>
  </div></section>
  </main>

  <footer><div class="wrap">
    <p class="disc" id="disc"></p>
    <p class="links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></p>
    <p class="built">Made in München · Studierendenprojekt</p>
  </div></footer>

  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="revealHead" aria-describedby="revealBody">
    <div class="card">
      <button type="button" class="x" data-close aria-label="Schließen">✕</button>
      <img id="m-owl" class="m-owl pixel" src="assets/img/owl-mascot.png" alt="">
      <h2 id="revealHead"></h2>
      <p class="body" id="revealBody"></p>
      <form class="form" id="form" novalidate>
        <input type="email" id="email" name="email" inputmode="email" autocomplete="email" required aria-label="E-Mail-Adresse" placeholder="deine@uni-mail.de">
        <label class="optin"><input type="checkbox" id="optin"><span id="optinLabel"></span></label>
        <div class="err" id="emailErr" role="alert"></div>
        <button type="submit" class="submit" id="emailBtn">Benachrichtige mich</button>
      </form>
      <div class="thanks" id="thanks"></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
